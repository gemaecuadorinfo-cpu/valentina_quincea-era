<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f2e8">
<title>XV años de Valentina Lara Ortega</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee7dc;color:#3d493d;font-family:Georgia,'Times New Roman',serif}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.viewer{width:min(100%,560px)}
.slide{display:none;position:relative;width:100%;box-shadow:0 15px 42px #493b2928;overflow:hidden;background:#f8f4eb}
.slide.active{display:block;animation:appear .35s ease}
.slide img{display:block;width:100%;height:auto}
@keyframes appear{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* Enlaces transparentes colocados exactamente sobre los botones del diseño de referencia. */
.hotspot{position:absolute;display:block;border-radius:30px;z-index:2;background:transparent}
.map-link{left:29.8%;top:60.5%;width:42%;height:6.7%}
.wa-link{left:29.8%;top:78.2%;width:42%;height:6.8%}
/* El contador real reemplaza los ceros decorativos de la plantilla. */
.timer{position:absolute;left:10.4%;top:48.0%;width:79.3%;height:20.5%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.1%;align-items:stretch}
.unit{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(250,247,238,.97);border:1px solid #c99442;outline:1px solid rgba(201,148,66,.55);outline-offset:3px;border-radius:8px;color:#4c5130;min-width:0}
.unit strong{font-size:clamp(22px,6.5vw,39px);font-weight:400;line-height:1.05;font-variant-numeric:tabular-nums}
.unit span{font-size:clamp(10px,2.7vw,15px);margin-top:5px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 2px}
.nav button{border:1px solid #b58a4a;background:#fffaf2;color:#695333;padding:10px 13px;font:15px Georgia,serif;border-radius:4px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#cbbd9f}
.dot.active{background:#8a7545;transform:scale(1.25)}
.page-no{font-size:13px;color:#6d685b;white-space:nowrap}
@keyframes pulse{50%{transform:scale(1.025)}}
@media(max-width:420px){main{padding:6px}.nav button{padding:9px 10px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.slide.active{animation:none}}
</style>
</head>

<button id="prev" type="button" disabled>‹ Anterior</button>
<div class="dots" aria-label="Páginas">
<span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
</div>
<span class="page-no" id="pageNo">1 / 4</span>
<button id="next" type="button">Siguiente ›</button>

</main>
<script>
const slides=[...document.querySelectorAll('.slide')];
const dots=[...document.querySelectorAll('.dot')];
let current=0;
function showPage(n){
 current=Math.max(0,Math.min(3,n));
 slides.forEach((s,i)=>s.classList.toggle('active',i===current));
 dots.forEach((d,i)=>d.classList.toggle('active',i===current));
 document.getElementById('pageNo').textContent=(current+1)+' / 4';
 document.getElementById('prev').disabled=current===0;
 document.getElementById('next').disabled=current===3;
}
document.getElementById('prev').addEventListener('click',()=>showPage(current-1));
document.getElementById('next').addEventListener('click',()=>showPage(current+1));
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')showPage(current+1);
 if(e.key==='ArrowLeft')showPage(current-1);
});
const eventTime=new Date('2026-12-05T19:00:00-05:00').getTime();
function updateCountdown(){
 const diff=eventTime-Date.now();
 if(diff<=0){
  ['days','hours','minutes','seconds'].forEach(id=>document.getElementById(id).textContent='00');
  return;
 }
 const values={
  days:Math.floor(diff/86400000),
  hours:Math.floor((diff%86400000)/3600000),
  minutes:Math.floor((diff%3600000)/60000),
  seconds:Math.floor((diff%60000)/1000)
 };
 Object.entries(values).forEach(([id,value])=>document.getElementById(id).textContent=String(value).padStart(2,'0'));
}
updateCountdown();
setInterval(updateCountdown,1000);
</script>
